      description: 'Veraltet, nutze `GET /v2/matches/{id}/events`.'
      deprecated: true
      operationId: listMatchEventsV1
      parameters: [{ $ref: '#/components/parameters/AfterSeq' }]
      responses:
        '200': { $ref: '#/components/responses/EventList' }
