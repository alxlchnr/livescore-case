openapi: 3.0.3
info:
  title: Livescore API
  version: 2.0.0
  description: |
    API für Wettbewerbsverwaltung und Livescoring. Alle Daten liegen im Speicher und werden bei jedem
    Neustart der API auf den Ausgangsbestand zurückgesetzt.

    ## Versionen
    - **v2** (aktuell): Lesen ohne Anmeldung, Schreiben nur mit Bearer-Token und passender Berechtigung.
    - **v1** (veraltet): identische Fachlichkeit ohne Authentifizierung. Mitgesendete Tokens werden ignoriert.

    Beide Versionen arbeiten auf demselben Datenbestand.

    ## Anmeldung
    Token über `POST /api/v2/auth/login` holen und in der Swagger UI unter **Authorize** eintragen.
    Gültigkeit: 8 Stunden.

    | Benutzer | Rolle | Berechtigung |
    |---|---|---|
    | `admin` | `SYSTEM_ADMIN` | alles |
    | `handball-admin` | `LEAGUE_ADMIN` | Handball-Regionalliga Süd |
    | `volleyball-admin` | `LEAGUE_ADMIN` | Volleyball-Stadtturnier |
    | `schreiber-handball` | `SCORER` | zugewiesene Handballspiele |
    | `schreiber-volleyball` | `SCORER` | zugewiesene Volleyballspiele |

    Passwort für alle Benutzer: `livescore`

    ## Rollen
    - `SYSTEM_ADMIN` darf alles.
    - `LEAGUE_ADMIN` verwaltet die Wettbewerbe, denen er als Admin zugewiesen ist, sowie deren Teams und Spiele.
    - `SCORER` erfasst Ereignisse in Spielen, denen er als Schreiber zugewiesen ist.

    Berechtigungen werden bei jeder Anfrage gegen den aktuellen Datenbestand geprüft; geänderte Zuweisungen
    wirken sofort.

    ## Fehler
    Fehler haben das Format `{ "statusCode": 400, "message": "…", "error": "Bad Request" }`.
security: []
servers:
  - url: /api
tags:
  - name: Auth
    description: Anmeldung (nur v2)
  - name: Wettbewerbe
    description: Ligen und Turniere
  - name: Teams
    description: Teams und Benutzer
  - name: Spiele
    description: Spielplan und Schreiber
  - name: Live
    description: Ereignisse, Spielstand und Echtzeit-Aktualisierungen
  - name: Wettbewerbe (v1)
    description: Veraltet – siehe Wettbewerbe
  - name: Teams (v1)
    description: Veraltet – siehe Teams
  - name: Spiele (v1)
    description: Veraltet – siehe Spiele
  - name: Live (v1)
    description: Veraltet – siehe Live

paths:
  # ───────────────────────────── v2 ─────────────────────────────
  /v2/auth/login:
    post:
      tags: [Auth]
      summary: Anmelden
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: handball-admin, password: livescore }
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/auth/me:
    get:
      tags: [Auth]
      summary: Aktueller Benutzer
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Daten des angemeldeten Benutzers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/leagues:
    get:
      tags: [Wettbewerbe]
      summary: Ligen auflisten
      operationId: listLeagues
      responses:
        '200': { $ref: '#/components/responses/LeagueList' }
    post:
      tags: [Wettbewerbe]
      summary: Liga anlegen
      description: 'Berechtigt: `SYSTEM_ADMIN`.'
      operationId: createLeague
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/LeagueInput' }
      responses:
        '201': { $ref: '#/components/responses/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/leagues/{id}:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    get:
      tags: [Wettbewerbe]
      summary: Liga abrufen
      operationId: getLeague
      responses:
        '200': { $ref: '#/components/responses/League' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Wettbewerbe]
      summary: Liga ändern
      description: 'Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieser Liga.'
      operationId: updateLeague
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/LeagueInput' }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Wettbewerbe]
      summary: Liga löschen
      description: |
        Löscht die Liga samt ihrer Spiele. Teams bleiben erhalten.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieser Liga.
      operationId: deleteLeague
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/leagues/{id}/teams:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    put:
      tags: [Wettbewerbe]
      summary: Teams der Liga setzen
      description: |
        Ersetzt die Liste der zugeordneten Teams vollständig. Bei unbekannten Team-IDs bleibt die Zuordnung unverändert.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieser Liga.
      operationId: setLeagueTeams
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TeamIds' }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/leagues/{id}/admins:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    put:
      tags: [Wettbewerbe]
      summary: Admins der Liga setzen
      description: |
        Ersetzt die Liste der zuständigen Benutzer vollständig.

        Berechtigt: `SYSTEM_ADMIN`.
      operationId: setLeagueAdmins
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AdminIds' }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/tournaments:
    get:
      tags: [Wettbewerbe]
      summary: Turniere auflisten
      operationId: listTournaments
      responses:
        '200': { $ref: '#/components/responses/TournamentList' }
    post:
      tags: [Wettbewerbe]
      summary: Turnier anlegen
      description: 'Berechtigt: `SYSTEM_ADMIN`.'
      operationId: createTournament
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TournamentInput' }
      responses:
        '201': { $ref: '#/components/responses/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/tournaments/{id}:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    get:
      tags: [Wettbewerbe]
      summary: Turnier abrufen
      operationId: getTournament
      responses:
        '200': { $ref: '#/components/responses/Tournament' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Wettbewerbe]
      summary: Turnier ändern
      description: 'Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieses Turniers.'
      operationId: updateTournament
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TournamentInput' }
      responses:
        '200': { $ref: '#/components/responses/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Wettbewerbe]
      summary: Turnier löschen
      description: |
        Löscht das Turnier samt seiner Spiele. Teams bleiben erhalten.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieses Turniers.
      operationId: deleteTournament
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/tournaments/{id}/teams:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    put:
      tags: [Wettbewerbe]
      summary: Teams des Turniers setzen
      description: |
        Ersetzt die Liste der zugeordneten Teams vollständig. Bei unbekannten Team-IDs bleibt die Zuordnung unverändert.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` dieses Turniers.
      operationId: setTournamentTeams
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TeamIds' }
      responses:
        '200': { $ref: '#/components/responses/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/tournaments/{id}/admins:
    parameters: [{ $ref: '#/components/parameters/CompetitionId' }]
    put:
      tags: [Wettbewerbe]
      summary: Admins des Turniers setzen
      description: |
        Ersetzt die Liste der zuständigen Benutzer vollständig.

        Berechtigt: `SYSTEM_ADMIN`.
      operationId: setTournamentAdmins
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AdminIds' }
      responses:
        '200': { $ref: '#/components/responses/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/teams:
    get:
      tags: [Teams]
      summary: Teams auflisten
      operationId: listTeams
      responses:
        '200': { $ref: '#/components/responses/TeamList' }
    post:
      tags: [Teams]
      summary: Team anlegen
      description: 'Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN`.'
      operationId: createTeam
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TeamInput' }
      responses:
        '201': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/teams/{id}:
    parameters: [{ $ref: '#/components/parameters/TeamId' }]
    get:
      tags: [Teams]
      summary: Team abrufen
      operationId: getTeam
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Teams]
      summary: Team ändern
      description: 'Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` eines Wettbewerbs, dem das Team angehört.'
      operationId: updateTeam
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TeamInput' }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      summary: Team löschen
      description: |
        Entfernt das Team auch aus allen Wettbewerben. Teams mit angesetzten Spielen können nicht gelöscht werden.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` eines Wettbewerbs, dem das Team angehört.
      operationId: deleteTeam
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v2/users:
    get:
      tags: [Teams]
      summary: Benutzer auflisten
      description: |
        Zur Auswahl von Admins und Schreibern.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN`.
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/matches:
    get:
      tags: [Spiele]
      summary: Spiele auflisten
      description: Sortiert nach Anstoßzeit.
      operationId: listMatches
      parameters:
        - $ref: '#/components/parameters/CompetitionFilter'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200': { $ref: '#/components/responses/MatchList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Spiele]
      summary: Spiel ansetzen
      description: |
        Legt ein Spiel mit Status `SCHEDULED` und Stand 0:0 an. Beide Teams müssen dem Wettbewerb zugeordnet und verschieden sein.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` des Wettbewerbs.
      operationId: createMatch
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/MatchInput' }
      responses:
        '201': { $ref: '#/components/responses/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v2/matches/{id}:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [Spiele]
      summary: Spiel abrufen
      description: Spiel mit Teams, Status, laufendem Abschnitt und Spielstand.
      operationId: getMatch
      responses:
        '200': { $ref: '#/components/responses/Match' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Spiele]
      summary: Spiel ändern
      description: |
        Ändert Teams, Anstoßzeit und Spielort. Der Wettbewerb kann nicht geändert werden. Teams können nur geändert
        werden, solange noch keine Ereignisse erfasst sind.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` des Wettbewerbs.
      operationId: updateMatch
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/MatchUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Spiele]
      summary: Spiel löschen
      description: |
        Löscht das Spiel samt Ereignissen und beendet offene Streams.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` des Wettbewerbs.
      operationId: deleteMatch
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/matches/{id}/scorers:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    put:
      tags: [Spiele]
      summary: Schreiber des Spiels setzen
      description: |
        Ersetzt die Liste der Schreiber vollständig. Nur diese Benutzer (mit Rolle `SCORER`) dürfen in v2 Ereignisse erfassen.

        Berechtigt: `SYSTEM_ADMIN` oder `LEAGUE_ADMIN` des Wettbewerbs.
      operationId: setMatchScorers
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ScorerIds' }
      responses:
        '200': { $ref: '#/components/responses/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/matches/{id}/events:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [Live]
      summary: Ereignisse auflisten
      description: Alle Ereignisse des Spiels in `seq`-Reihenfolge, inklusive korrigierter Ereignisse.
      operationId: listMatchEvents
      parameters: [{ $ref: '#/components/parameters/AfterSeq' }]
      responses:
        '200': { $ref: '#/components/responses/EventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Live]
      summary: Ereignis erfassen
      description: |
        Erfasst ein Spielereignis und liefert es zusammen mit dem neuen Spielstand. Siehe Schema `EventInput` für die
        Ereignistypen und ihre Bedingungen.

        Wird eine bereits verwendete `clientEventId` erneut gesendet, antwortet die API mit `200` und dem bereits
        gespeicherten Ereignis, ohne ein neues anzulegen.

        Berechtigt: `SCORER`, der dem Spiel zugewiesen ist, `LEAGUE_ADMIN` des Wettbewerbs oder `SYSTEM_ADMIN`.
        `createdBy` ist der Benutzername.
      operationId: createMatchEvent
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/EventInput' }
      responses:
        '201': { $ref: '#/components/responses/MatchUpdate' }
        '200': { $ref: '#/components/responses/MatchUpdateDuplicate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EventConflict' }

  /v2/matches/{id}/stream:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [Live]
      summary: Echtzeit-Stream (Server-Sent Events)
      description: |
        Öffnet einen dauerhaften Server-Sent-Events-Stream. Für jedes neue Ereignis wird eine Nachricht gesendet:

        ```
        id: 47
        event: match-event
        data: {"event":{…},"score":{…},"status":"LIVE","currentPeriod":2}
        ```

        - `id` ist die `seq` des Ereignisses.
        - `data` hat das Schema `MatchUpdate`; der Spielstand entspricht dem Stand nach diesem Ereignis.
        - Etwa alle 15 Sekunden sendet der Server die Kommentarzeile `: heartbeat`.
        - Zu Beginn sendet der Server `retry: 3000` (Wiederverbindung nach 3 Sekunden).

        **Wiederaufnahme:** Mit dem Header `Last-Event-ID` (setzt `EventSource` beim automatischen Wiederverbinden
        selbst) oder dem Query-Parameter `lastEventId` liefert der Server zuerst alle Ereignisse mit größerer `seq`
        nach und setzt danach live fort. Ohne Angabe werden zuerst alle bisherigen Ereignisse gesendet.

        Werden Streams unterwegs gepuffert, liefert `GET /v2/matches/{id}/updates` dieselben Nachrichten per Long-Poll.
      operationId: streamMatch
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Zuletzt empfangene `seq`.
          schema: { type: integer, minimum: 0 }
        - name: lastEventId
          in: query
          required: false
          description: Alternative zum Header, z. B. für den ersten Verbindungsaufbau mit `EventSource`.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Ereignis-Stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Folge von Nachrichten im SSE-Format; `data` entspricht `MatchUpdate`.
              example: |
                id: 47
                event: match-event
                data: {"event":{"id":"match-3-e47","matchId":"match-3","seq":47,"type":"SCORE","team":"HOME","points":1,"createdAt":"2026-05-17T18:42:10.000Z","createdBy":"simulator"},"score":{"home":20,"away":18,"periods":[{"period":1,"home":13,"away":11,"winner":"HOME"},{"period":2,"home":7,"away":7,"winner":null}]},"status":"LIVE","currentPeriod":2}

        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v2/matches/{id}/updates:
    parameters: [{ $ref: '#/components/parameters/MatchId' }]
    get:
      tags: [Live]
      summary: Echtzeit-Aktualisierungen (Long-Poll)
      description: |
        Alternative zum Stream für Umgebungen, in denen Streaming-Antworten unterwegs gepuffert werden. Jede Antwort ist
        eine abgeschlossene JSON-Antwort; der Client fragt in einer Schleife erneut ab.

        - Gibt es Ereignisse mit `seq` größer `afterSeq`, antwortet die API sofort mit allen davon.
        - Sonst hält die API die Anfrage, bis ein neues Ereignis erfasst wird (sofortige Antwort) oder `wait`
          Sekunden vergangen sind (Antwort mit leerer Liste `updates`).
        - Ist das Spiel `FINISHED` und gibt es keine neueren Ereignisse, antwortet die API sofort mit leerer Liste.
          Der Client kann das Abfragen dann beenden.

        Die Elemente von `updates` entsprechen genau den `data` der Stream-Nachrichten (`MatchUpdate`). Für die nächste
        Abfrage wird `lastSeq` als `afterSeq` übernommen. Antworten werden nicht zwischengespeichert
        (`Cache-Control: no-store`).
      operationId: pollMatchUpdates
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - name: wait
          in: query
          required: false
          description: Maximale Wartezeit in Sekunden. Werte über 25 werden auf 25 begrenzt; `0` antwortet sofort.
          schema: { type: integer, minimum: 0, maximum: 25, default: 20 }
      responses:
        '200':
          description: Neue Aktualisierungen oder leere Liste nach Ablauf der Wartezeit
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchUpdates' }
              example:
                updates:
                  - event:
                      id: match-3-e47
                      matchId: match-3
                      seq: 47
                      type: SCORE
                      team: HOME
                      points: 1
                      createdAt: '2026-05-17T18:42:10.000Z'
                      createdBy: simulator
                    score:
                      home: 20
                      away: 18
                      periods:
                        - { period: 1, home: 13, away: 11, winner: HOME }
                        - { period: 2, home: 7, away: 7, winner: null }
                    status: LIVE
                    currentPeriod: 2
                lastSeq: 47
                status: LIVE
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Spiel nicht gefunden oder während des Wartens gelöscht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

