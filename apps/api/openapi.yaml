      deprecated: true
      operationId: createMatchEventV1
      requestBody: { $ref: '#/components/requestBodies/EventInput' }
      responses:
        '201': { $ref: '#/components/responses/MatchUpdate' }
        '200': { $ref: '#/components/responses/MatchUpdateDuplicate' }
        '400': { $ref: '#/components/responses/BadRequest' }
