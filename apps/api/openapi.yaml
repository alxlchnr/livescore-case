      deprecated: true
      operationId: streamMatchV1
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Zuletzt empfangene `seq`.
          schema: { type: integer, minimum: 0 }
        - name: lastEventId
          in: query
          required: false
          description: Alternative zum Header.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Ereignis-Stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token aus `POST /v2/auth/login`.

  parameters:
    CompetitionId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: league-1
    TeamId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: team-1
    MatchId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: match-3
    CompetitionFilter:
      name: competitionId
      in: query
      required: false
      description: Nur Spiele dieses Wettbewerbs (Liga oder Turnier).
      schema: { type: string }
    StatusFilter:
      name: status
      in: query
      required: false
      description: Nur Spiele mit diesem Status.
      schema: { $ref: '#/components/schemas/MatchStatus' }
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      description: Nur Ereignisse mit `seq` größer diesem Wert.
      schema: { type: integer, minimum: 0 }

  requestBodies:
    LeagueInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LeagueInput' }
    TournamentInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TournamentInput' }
    TeamInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TeamInput' }
    TeamIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [teamIds]
            properties:
              teamIds: { type: array, items: { type: string }, example: [team-1, team-2] }
    AdminIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [adminIds]
            properties:
              adminIds: { type: array, items: { type: string }, example: [user-2] }
    ScorerIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [scorerIds]
            properties:
              scorerIds: { type: array, items: { type: string }, example: [user-4] }
    MatchInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MatchInput' }
    MatchUpdateInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MatchUpdateInput' }
    EventInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventInput' }
          examples:
            score:
              summary: Punkt/Tor für das Heimteam
              value: { type: SCORE, team: HOME, clientEventId: 7f9c2b1e-0001 }
            threePoints:
              summary: Drei Punkte (nur kumulative Wertung)
              value: { type: SCORE, team: AWAY, points: 3 }
            periodStarted:
              summary: Abschnitt beginnen
              value: { type: PERIOD_STARTED }
            correction:
              summary: Ereignis zurücknehmen
              value: { type: CORRECTION, revertsEventId: match-3-e47 }
            note:
              summary: Notiz
              value: { type: NOTE, text: Verletzungsunterbrechung }

  responses:
    League:
      description: Liga
      content:
        application/json:
          schema: { $ref: '#/components/schemas/League' }
    LeagueList:
      description: Ligen
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/League' } }
    Tournament:
      description: Turnier
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tournament' }
    TournamentList:
      description: Turniere
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
    Team:
      description: Team
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Team' }
    TeamList:
      description: Teams
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/Team' } }
    UserList:
      description: Benutzer
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/User' } }
    Match:
      description: Spiel
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Match' }
    MatchList:
      description: Spiele
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/Match' } }
    EventList:
      description: Ereignisse
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/MatchEvent' } }
    MatchUpdate:
      description: Ereignis gespeichert
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MatchUpdate' }
    MatchUpdateDuplicate:
      description: '`clientEventId` war bereits bekannt; das gespeicherte Ereignis wird zurückgegeben.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MatchUpdate' }
    BadRequest:
      description: Ungültige Eingabe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 400, message: 'Feld "name" ist erforderlich.', error: Bad Request }
    Unauthorized:
      description: Nicht angemeldet, Token ungültig oder Anmeldedaten falsch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 401, message: Bearer-Token fehlt., error: Unauthorized }
    Forbidden:
      description: Keine Berechtigung für diese Ressource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 403, message: Keine Berechtigung für diesen Wettbewerb., error: Forbidden }
    NotFound:
      description: Ressource existiert nicht
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 404, message: 'Spiel "match-99" wurde nicht gefunden.', error: Not Found }
    Conflict:
      description: Aktion im aktuellen Zustand nicht möglich
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EventConflict:
      description: Ereignis passt nicht zum Spielzustand (siehe `EventInput`) oder Korrektur ist ungültig
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 409, message: Es läuft kein Abschnitt., error: Conflict }

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, example: 400 }
        message: { type: string }
        error: { type: string }

    ScoringMode:
      type: string
      enum: [CUMULATIVE, SETS]
      description: |
        - `CUMULATIVE`: Gesamtstand = Summe der Punkte aller Abschnitte (z. B. Handball).
        - `SETS`: Gesamtstand = Anzahl gewonnener Abschnitte (z. B. Volleyball).

    MatchStatus:
      type: string
      enum: [SCHEDULED, LIVE, FINISHED]

    Side:
      type: string
      enum: [HOME, AWAY]

    League:
      type: object
      required: [id, name, season, scoringMode, teamIds, adminIds]
      properties:
        id: { type: string, example: league-1 }
        name: { type: string, example: Handball-Regionalliga Süd }
        season: { type: string, example: 2026/27 }
        scoringMode: { $ref: '#/components/schemas/ScoringMode' }
        teamIds: { type: array, items: { type: string } }
        adminIds: { type: array, items: { type: string }, description: IDs der zuständigen Benutzer }

    LeagueInput:
      type: object
      required: [name, season, scoringMode]
      properties:
        name: { type: string, example: Handball-Oberliga }
        season: { type: string, example: 2026/27 }
        scoringMode: { $ref: '#/components/schemas/ScoringMode' }

    Tournament:
      type: object
      required: [id, name, startDate, endDate, scoringMode, teamIds, adminIds]
      properties:
        id: { type: string, example: tournament-1 }
        name: { type: string, example: Volleyball-Stadtturnier }
        startDate: { type: string, format: date, example: '2026-05-16' }
        endDate: { type: string, format: date, example: '2026-05-18' }
        scoringMode: { $ref: '#/components/schemas/ScoringMode' }
        teamIds: { type: array, items: { type: string } }
        adminIds: { type: array, items: { type: string }, description: IDs der zuständigen Benutzer }

    TournamentInput:
      type: object
      required: [name, startDate, endDate, scoringMode]
      description: '`endDate` darf nicht vor `startDate` liegen.'
      properties:
        name: { type: string, example: Beach-Cup }
        startDate: { type: string, format: date, example: '2026-07-04' }
        endDate: { type: string, format: date, example: '2026-07-05' }
        scoringMode: { $ref: '#/components/schemas/ScoringMode' }

    Team:
      type: object
      required: [id, name, shortName]
      properties:
        id: { type: string, example: team-1 }
        name: { type: string, example: HSG Neckartal }
        shortName: { type: string, example: NEC }

    TeamInput:
      type: object
      required: [name, shortName]
      properties:
        name: { type: string, example: SC Hafenviertel }
        shortName: { type: string, example: HAF }

    Role:
      type: string
      enum: [SYSTEM_ADMIN, LEAGUE_ADMIN, SCORER]

    User:
      type: object
      required: [id, username, name, roles]
      properties:
        id: { type: string, example: user-2 }
        username: { type: string, example: handball-admin }
        name: { type: string, example: Hanna Berger }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: object
              description: Aus dem aktuellen Datenbestand abgeleitete Zuweisungen.
              required: [competitionIds, matchIds]
              properties:
                competitionIds:
                  type: array
                  items: { type: string }
                  description: Wettbewerbe, für die der Benutzer als Admin eingetragen ist
                matchIds:
                  type: array
                  items: { type: string }
                  description: Spiele, für die der Benutzer als Schreiber eingetragen ist

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 'JWT (HS256), 8 Stunden gültig. Payload: `sub`, `name`, `roles`, `scopes` (`competitionIds`, `matchIds` zum Zeitpunkt der Anmeldung).'
        user: { $ref: '#/components/schemas/CurrentUser' }

    MatchInput:
      type: object
      required: [competitionId, homeTeamId, awayTeamId, scheduledAt]
      properties:
        competitionId: { type: string, example: league-1 }
        homeTeamId: { type: string, example: team-2 }
        awayTeamId: { type: string, example: team-5 }
        scheduledAt: { type: string, format: date-time, example: '2026-12-05T18:00:00Z' }
        venue: { type: string, example: Bergheim-Arena }

    MatchUpdateInput:
      type: object
      required: [homeTeamId, awayTeamId, scheduledAt]
      properties:
        homeTeamId: { type: string }
        awayTeamId: { type: string }
        scheduledAt: { type: string, format: date-time }
        venue: { type: string }

    PeriodScore:
      type: object
      required: [period, home, away, winner]
      properties:
        period: { type: integer, example: 3, description: 'Abschnitt (Halbzeit, Satz, Viertel …), beginnend bei 1' }
        home: { type: integer, example: 12 }
        away: { type: integer, example: 9 }
        winner:
          type: string
          nullable: true
          enum: [HOME, AWAY, DRAW, null]
          description: Gewinner des Abschnitts; `null`, solange der Abschnitt läuft.

    Score:
      type: object
      required: [home, away, periods]
      description: |
        Aus den Ereignissen berechneter Spielstand. Bei `CUMULATIVE` ist der Gesamtstand die Summe der Punkte aller
        Abschnitte, bei `SETS` die Anzahl gewonnener Abschnitte.
      properties:
        home: { type: integer, example: 1 }
        away: { type: integer, example: 1 }
        periods: { type: array, items: { $ref: '#/components/schemas/PeriodScore' } }
      example:
        home: 1
        away: 1
        periods:
          - { period: 1, home: 25, away: 21, winner: HOME }
          - { period: 2, home: 23, away: 25, winner: AWAY }
          - { period: 3, home: 12, away: 9, winner: null }

    Match:
      type: object
      required: [id, competitionId, scoringMode, homeTeam, awayTeam, scheduledAt, scorerIds, status, currentPeriod, score, lastSeq]
      properties:
        id: { type: string, example: match-9 }
        competitionId: { type: string, example: tournament-1 }
        scoringMode: { $ref: '#/components/schemas/ScoringMode' }
        homeTeam: { $ref: '#/components/schemas/Team' }
        awayTeam: { $ref: '#/components/schemas/Team' }
        scheduledAt: { type: string, format: date-time }
        venue: { type: string, example: Halle 1 }
        scorerIds: { type: array, items: { type: string }, description: IDs der zuständigen Schreiber }
        status: { $ref: '#/components/schemas/MatchStatus' }
        currentPeriod:
          type: integer
          nullable: true
          description: Laufender Abschnitt; `null` vor dem ersten Abschnitt, zwischen Abschnitten und nach Spielende.
        score: { $ref: '#/components/schemas/Score' }
        lastSeq: { type: integer, description: '`seq` des letzten Ereignisses (0, wenn keine Ereignisse)' }

    EventType:
      type: string
      enum: [MATCH_STARTED, PERIOD_STARTED, SCORE, PERIOD_ENDED, MATCH_ENDED, PENALTY, NOTE, CORRECTION]

    EventInput:
      type: object
      required: [type]
      description: |
        | Typ | Zusätzliche Felder | Erlaubt, wenn … | Wirkung |
        |---|---|---|---|
        | `MATCH_STARTED` | – | Spiel `SCHEDULED` | Status `LIVE` |
        | `PERIOD_STARTED` | – | Spiel `LIVE`, kein Abschnitt läuft | nächster Abschnitt beginnt |
        | `SCORE` | `team`, optional `points` | Abschnitt läuft | Punkte für `team` im laufenden Abschnitt |
        | `PERIOD_ENDED` | – | Abschnitt läuft | Abschnitt endet, Gewinner wird festgelegt |
        | `MATCH_ENDED` | – | Spiel `LIVE`, kein Abschnitt läuft | Status `FINISHED` |
        | `PENALTY` | `team`, optional `text` | Spiel `LIVE` | nur Information, kein Einfluss auf den Stand |
        | `NOTE` | `text` | immer | nur Information |
        | `CORRECTION` | `revertsEventId` | immer | neutralisiert ein `SCORE`/`PENALTY` |

        Nach `MATCH_ENDED` sind nur noch `NOTE` und `CORRECTION` möglich. Verstöße ergeben `409`.

        `points` (Standard 1) wird nur bei `CUMULATIVE` berücksichtigt; bei `SETS` zählt jeder `SCORE` einen Punkt.
        Sportartspezifische Regeln (Satzlänge, Mindestvorsprung, Anzahl Abschnitte) prüft die API nicht.

        Ein Ereignis kann nur einmal korrigiert werden; Korrekturen auf unbekannte, bereits korrigierte oder andere
        Ereignistypen ergeben `409`.
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        team: { $ref: '#/components/schemas/Side' }
        points: { type: integer, minimum: 1, default: 1 }
        revertsEventId: { type: string, description: ID des zu neutralisierenden Ereignisses }
        text: { type: string }
        clientEventId:
          type: string
          description: Vom Client vergebene ID; ein erneutes Senden mit derselben ID legt kein zweites Ereignis an.

    MatchEvent:
      type: object
      required: [id, matchId, seq, type, createdAt, createdBy]
      properties:
        id: { type: string, example: match-3-e47 }
        matchId: { type: string, example: match-3 }
        seq: { type: integer, example: 47, description: 'Pro Spiel fortlaufende Nummer, beginnend bei 1' }
        type: { $ref: '#/components/schemas/EventType' }
        team: { $ref: '#/components/schemas/Side' }
        points: { type: integer }
        revertsEventId: { type: string }
        text: { type: string }
        clientEventId: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: string
          description: Benutzername; `anonymous` bei Erfassung über v1, `simulator` beim Live-Simulator.

    MatchUpdate:
      type: object
      required: [event, score, status, currentPeriod]
      description: Ein Ereignis mit dem Spielzustand unmittelbar nach diesem Ereignis.
      properties:
        event: { $ref: '#/components/schemas/MatchEvent' }
        score: { $ref: '#/components/schemas/Score' }
        status: { $ref: '#/components/schemas/MatchStatus' }
        currentPeriod: { type: integer, nullable: true }

    MatchUpdates:
      type: object
      required: [updates, lastSeq, status]
      description: Antwort des Long-Poll-Endpunkts.
      properties:
        updates:
          type: array
          description: Neue Ereignisse mit `seq` größer `afterSeq` in `seq`-Reihenfolge; leer nach Ablauf der Wartezeit.
          items: { $ref: '#/components/schemas/MatchUpdate' }
        lastSeq:
          type: integer
          minimum: 0
          description: Größte `seq` in `updates`, sonst das übergebene `afterSeq`. Wert für `afterSeq` der nächsten Abfrage.
        status: { $ref: '#/components/schemas/MatchStatus' }
